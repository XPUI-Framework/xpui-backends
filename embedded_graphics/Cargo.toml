[package]
name = "xpui-embedded-graphics"
description = "An xpui backend that draws through any embedded-graphics DrawTarget"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "embedded-graphics"]
categories = ["embedded", "gui", "no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "xpui_eg"
crate-type = ["rlib"]

[dependencies]
xpui.workspace = true
xpui-boards.workspace = true
xpui-chrome.workspace = true
embedded-graphics = "0.8"

# The typefaces. A pure-Rust reader for U8g2's bitmap font format: each face is
# an `include_bytes!` blob, so it lands in flash and is decoded a glyph at a
# time with no buffer and no allocation. `no_std` with nothing to opt into —
# its one optional feature is an `embedded-graphics` `TextRenderer` shim, and
# this backend draws through `FontRenderer` directly instead.
u8g2-fonts = "0.8"

# What makes `Backend` genuinely `Sync` rather than claiming to be. See
# `src/guarded.rs`.
#
# **No `-impl` feature, and never one.** A binary must have exactly one
# implementation of `critical-section` — the acquire symbol is process-wide —
# so a *library* that supplies one breaks every downstream that already has
# its own. This depends on the API alone; `examples/rp2040` gets the
# implementation from `embassy-rp`.
critical-section = { version = "1.2", optional = true }

[features]
# Lets xpui's UI harness feed this backend input. Pulls in xpui/testing, which
# is why it is a feature rather than always on: a firmware should not carry the
# test doubles.
testing = ["xpui/testing"]
# Guards this backend's state with a critical section, which is what a host
# that paints on a second task needs. Off by default: a desktop simulator and a
# single-threaded bare-metal loop do not want interrupts masked on every text
# measurement, and that is every consumer of the default.
critical-section = ["dep:critical-section"]

[dev-dependencies]
xpui = { workspace = true, features = ["testing"] }
xpui-embedded-graphics = { path = ".", features = ["testing"] }
# The host-side framebuffer its screenshot tests draw into. A
# **dev**-dependency: this crate builds for bare metal and must not carry a
# PNG codec into a firmware.
xpui-screenshot = { workspace = true, features = ["golden"] }
# An implementation, for the host, so a threaded test genuinely serialises
# rather than link-erroring on the acquire symbol. A **dev**-dependency: this
# is the one place a library may supply one, because a test binary is a binary.
critical-section = { version = "1.2", features = ["std"] }
