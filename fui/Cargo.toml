[package]
name = "xpui-fui"
description = "An xpui backend that draws through FreeInkUI, over a C ABI"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "freeink"]
categories = ["embedded", "gui", "no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The C++ half has to reach a consuming firmware's build, so it ships with the
# crate rather than only living in the repository.
# `cpp/**` is not optional: it is the shim, and a package without it is a
# backend a C++ host cannot link. `docs/**` ships the design notes and the
# coverage table beside the crate they describe — nothing `include_str!`s them
# any more, since the tutorial that did moved to `xpui-cpp`, so this one is a
# choice rather than a requirement.
include = ["src/**", "cpp/**", "docs/**", "README.md"]

[lib]
name = "xpui_fui"
crate-type = ["rlib"]

[features]
# Swaps the C entry points for host doubles, so the Rust half can be tested
# without a firmware to link against.
testing = []

[dependencies]
xpui.workspace = true

[dev-dependencies]
xpui = { workspace = true, features = ["testing"] }
xpui-fui = { path = ".", features = ["testing"] }
# The signature comparison itself. A test-only dependency: the crate it checks
# must not carry a checker into a firmware.
xpui-abi-check.workspace = true
