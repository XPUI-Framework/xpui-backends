# Whether a C header and the Rust beside it agree about types.
#
# Its own crate rather than a test module, because more than one boundary
# needs it: the FreeInkUI backend owns its pair and the C++ host owns two, in
# a repository of its own. A copy in each would be a checker that could not
# see its own drift.
[package]
name = "xpui-abi-check"
description = "Compares a C header against the Rust that declares or defines it, on types"
keywords = ["ffi", "abi", "testing", "c"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[lib]
name = "xpui_abi_check"
crate-type = ["rlib"]

# Host-only, and dependency-free. It reads text and compares maps.
[dependencies]
