[package]
name = "xpui-fui"
description = "An xpui backend that draws through FreeInkUI, over a C ABI"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "freeink"]
categories = ["embedded", "gui", "no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The C++ half ships with the crate: `cpp/**` is the shim, and a package
# without it is a backend a C++ host cannot link. `docs/**` ships every page
# beside the crate it describes.
include = ["src/**", "cpp/**", "docs/**", "README.md"]

[lints]
workspace = true

[lib]
name = "xpui_fui"
crate-type = ["rlib"]

[features]
# Swaps the C entry points for host doubles, so the Rust half can be tested
# without a firmware to link against.
testing = []

[dependencies]
xpui.workspace = true

[dev-dependencies]
xpui = { workspace = true, features = ["testing"] }
xpui-fui = { path = ".", features = ["testing"] }
# The signature comparison itself. A test-only dependency: the crate it checks
# must not carry a checker into a firmware.
xpui-abi-check.workspace = true
