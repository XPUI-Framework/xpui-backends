# The two backends, and the two test utilities they own.
#
# A backend teaches `xpui` how to paint: `xpui-embedded-graphics` hand-writes
# four host traits and takes `Chrome` from a macro, `xpui-fui` hand-writes all
# five over a C ABI and depends on nothing but the framework.
#
# `xpui-abi-check` compares a C header against the Rust that answers it — the
# `fui` boundary and the C++ host's; `xpui-screenshot` is the host framebuffer
# and its golden images, how a backend proves pixels without a panel.
[workspace]
# `xtask` is the gate. A member rather than a separate workspace so one
# `cargo test` reaches its tests.
members = ["abi-check", "embedded_graphics", "fui", "screenshot", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-backends"

[workspace.dependencies]
# Git dependencies, not versions: nothing is published, and a fresh clone of
# this repository has to build without its siblings on disk.
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
xpui-chrome = { git = "https://github.com/XPUI-Framework/xpui-chrome", branch = "main" }

xpui-abi-check = { path = "abi-check" }
# `default-features = false` here so a member that only wants `Framebuffer`
# gets no image codec. Anything comparing against a committed PNG asks for
# `features = ["golden"]` and says so at its own call site.
xpui-screenshot = { path = "screenshot", default-features = false }

# Three lints the compiler does not deny on its own, denied in every workspace
# root so that the table is one passage. `too_long_first_doc_paragraph` is the
# one to watch: it is a nursery lint, off by default, so clippy may rename or
# retire it — and a name clippy no longer knows is an `unknown_lints` warning,
# which `-D warnings` turns into a red gate in every repository at once.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# What a `cargo build --release` of this repository alone produces — not what
# ships. A library's profile applies only at the top of a build; a firmware's
# workspace sets the profile for everything it links; `xpui-rp2040`,
# `xpui-esp32` and `xpui-cpp` use `opt-level = "z"`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
